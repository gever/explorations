<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genetic car browser · low-poly laser-cut</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      background-color: #111;
      color: white;
    }
    #info {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0,0,0,0.65);
      padding: 10px 20px;
      border-radius: 40px;
      backdrop-filter: blur(8px);
      pointer-events: none;
      font-size: 15px;
      letter-spacing: 0.3px;
      border: 1px solid #444;
      z-index: 10;
    }
    #info span {
      color: #ffaa66;
      font-weight: 600;
    }

    #grid-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: calc(100vh - 140px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      padding: 6px;
      box-sizing: border-box;
      background: #1a1a1a;
    }

    .cell {
      background: #0d0d0d;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 0 1px #2a2a2a inset;
      transition: box-shadow 0.2s;
      cursor: pointer;
      position: relative;
    }

    .cell:hover {
      box-shadow: 0 0 0 2px #ffaa66 inset;
      z-index: 5;
    }

    .cell.selected {
      box-shadow: 0 0 0 3px #66ccff inset, 0 0 20px #66ccff44;
    }

    .cell canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.7);
      color: #ddd;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      pointer-events: none;
      border: 1px solid #444;
      font-family: monospace;
    }

    /* Bottom panel */
    #bottom-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 140px;
      background: #151515;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }

    #toolbar button {
      background: #2a2a2a;
      color: #eee;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #toolbar button:hover {
      background: #3a3a3a;
    }

    #toolbar button:active {
      background: #ffaa66;
      color: #111;
    }

    #toolbar button.primary {
      background: #66ccff22;
      border-color: #66ccff88;
      color: #cceeff;
    }

    #toolbar button.primary:hover {
      background: #66ccff44;
    }

    #toolbar button.active {
      background: #ffaa6622;
      border-color: #ffaa6688;
      color: #ffcc99;
    }

    #toolbar button.active:hover {
      background: #ffaa6644;
    }

    #toolbar button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #toolbar label {
      font-size: 13px;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #toolbar input[type="range"] {
      width: 120px;
      accent-color: #66ccff;
    }

    #toolbar .value-badge {
      font-family: monospace;
      color: #66ccff;
      background: #66ccff22;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      min-width: 20px;
      text-align: center;
    }

    #history-label {
      font-size: 12px;
      color: #888;
      margin-left: auto;
      font-family: monospace;
    }

    #history {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      flex: 1;
      align-items: center;
    }

    .history-item {
      flex-shrink: 0;
      width: 90px;
      height: 80px;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .history-item:hover {
      border-color: #66ccff;
    }

    .history-item.selected {
      border-color: #66ccff;
      box-shadow: 0 0 10px #66ccff66;
    }

    .history-item canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .history-item .history-badge {
      position: absolute;
      bottom: 2px;
      left: 2px;
      right: 2px;
      font-size: 9px;
      color: #aaa;
      text-align: center;
      background: rgba(0,0,0,0.6);
      border-radius: 4px;
      padding: 1px 0;
      font-family: monospace;
    }

    .history-empty {
      color: #555;
      font-size: 13px;
      font-style: italic;
    }

    /* 2D Net Modal */
    #net-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      box-sizing: border-box;
    }

    #net-modal.open {
      display: flex;
    }

    .net-dialog {
      background: #161616;
      border: 1px solid #383838;
      border-radius: 14px;
      width: min(1150px, 95vw);
      height: min(820px, 90vh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
    }

    .net-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      background: #1f1f1f;
      border-bottom: 1px solid #333;
      flex-wrap: wrap;
    }

    .net-title {
      font-weight: 600;
      font-size: 15px;
      color: #ffaa66;
      margin-right: 8px;
    }

    .net-header label {
      font-size: 13px;
      color: #ccc;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .net-header select {
      background: #2a2a2a;
      color: #eee;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
    }

    .net-header button {
      background: #2a2a2a;
      color: #eee;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
    }

    .net-header button:hover {
      background: #3a3a3a;
    }

    .net-header button.primary {
      background: #66ccff22;
      border-color: #66ccff88;
      color: #cceeff;
      margin-left: auto;
    }

    .net-header button.primary:hover {
      background: #66ccff44;
    }

    #net-viewport {
      flex: 1;
      background: #0e0e0e;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 20px;
    }

    #net-viewport svg {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
    }

    .net-footer {
      padding: 8px 18px;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      font-size: 12px;
      color: #999;
      display: flex;
      justify-content: space-between;
      font-family: monospace;
    }

    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 4px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="info">
    🧬 genetic car browser · click a car to <span>select &amp; breed</span> · dimensions in mm
  </div>
  <div id="grid-container"></div>

  <div id="bottom-panel">
    <div id="toolbar">
      <button id="reseed-btn">🔀 Re-seed All</button>
      <button id="pause-btn">⏸️ Pause Rotation</button>
      <button id="export-btn" class="primary" disabled>💾 Export STL (selected)</button>
      <button id="net-btn" class="primary" disabled>📐 View / Export 2D Net</button>
      <label>
        Initial points:
        <input type="range" id="points-slider" min="3" max="12" step="1" value="7">
        <span class="value-badge" id="points-value">7</span>
      </label>
      <label>
        Mutation:
        <input type="range" id="mutation-slider" min="5" max="100" step="5" value="35">
        <span class="value-badge" id="mutation-value">35%</span>
      </label>
      <span id="history-label">📜 Evolution history</span>
    </div>
    <div id="history"></div>
  </div>

  <div id="net-modal">
    <div class="net-dialog">
      <div class="net-header">
        <span class="net-title">📐 Unwrapped 2D Polygon Net</span>
        <label>
          Layout:
          <select id="net-layout-select">
            <option value="connected">Connected Net (Single-piece fold-up)</option>
            <option value="separate">Separate Panels (Side profiles + strip)</option>
          </select>
        </label>
        <label>
          <input type="checkbox" id="net-tabs-chk" checked>
          Glue tabs
        </label>
        <label>
          <input type="checkbox" id="net-labels-chk" checked>
          Labels &amp; edge numbers
        </label>
        <button id="net-download-btn" class="primary">💾 Download SVG (1:1 mm)</button>
        <button id="net-close-btn">✕ Close</button>
      </div>
      <div id="net-viewport"></div>
      <div class="net-footer">
        <span>
          <span class="legend-dot" style="background:#ff4444;"></span>Solid Red = Cut
          &nbsp;&nbsp;
          <span class="legend-dot" style="background:#33aaff;"></span>Dashed Blue = Score / Fold
          &nbsp;&nbsp;
          <span class="legend-dot" style="background:#ffaa66;"></span>Amber = Etch / Labels
        </span>
        <span id="net-dimensions-info"></span>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // --- configuration ---
    const GRID_SIZE = 3;
    const TOTAL_CELLS = GRID_SIZE * GRID_SIZE;
    const BASE_LENGTH  = 140; // flat bottom segment length in mm
    const HALF_BASE    = BASE_LENGTH / 2; // 70 mm (-70 to +70)
    const LENGTH_RANGE = [140, 200];
    const FIXED_WIDTH  = 80;
    const HEIGHT_RANGE = [60, 140];
    const MIN_POINTS   = 3;
    const MAX_POINTS   = 20;

    // --- global state ---
    let profilePointCount = 7;  // initial points count (3..12)
    let mutationRate = 0.35;    // 0.05..1.0
    let selectedIndex = -1;     // index of selected cell, -1 = none
    let history = [];           // array of genomes (selected over time)
    let genomes = [];           // current genomes for each cell
    let isRotationPaused = false;
    let currentRotationY = 0.5;

    // --- helpers ---
    function randInt(min, max) {
      return Math.floor(min + Math.random() * (max - min + 1));
    }

    function clampInt(v, min, max) {
      return Math.min(max, Math.max(min, Math.round(v)));
    }

    function gauss() {
      let u = 0, v = 0;
      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();
      return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
    }

    // --- 2D integer polygon geometry & simplicity checks ---
    function cross2D(ax, ay, bx, by, cx, cy) {
      return (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
    }

    function onSegment(ax, ay, bx, by, px, py) {
      return (
        px >= Math.min(ax, bx) && px <= Math.max(ax, bx) &&
        py >= Math.min(ay, by) && py <= Math.max(ay, by)
      );
    }

    // Returns true if closed segments AB and CD intersect anywhere
    function segmentsIntersect(a, b, c, d) {
      const d1 = cross2D(c.x, c.y, d.x, d.y, a.x, a.y);
      const d2 = cross2D(c.x, c.y, d.x, d.y, b.x, b.y);
      const d3 = cross2D(a.x, a.y, b.x, b.y, c.x, c.y);
      const d4 = cross2D(a.x, a.y, b.x, b.y, d.x, d.y);

      if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) &&
          ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) {
        return true;
      }
      if (d1 === 0 && onSegment(c.x, c.y, d.x, d.y, a.x, a.y)) return true;
      if (d2 === 0 && onSegment(c.x, c.y, d.x, d.y, b.x, b.y)) return true;
      if (d3 === 0 && onSegment(a.x, a.y, b.x, b.y, c.x, c.y)) return true;
      if (d4 === 0 && onSegment(a.x, a.y, b.x, b.y, d.x, d.y)) return true;
      return false;
    }

    function polygonSignedArea(pts) {
      let area2 = 0;
      const n = pts.length;
      for (let i = 0; i < n; i++) {
        const p = pts[i];
        const q = pts[(i + 1) % n];
        area2 += p.x * q.y - q.x * p.y;
      }
      return area2 * 0.5;
    }

    // Verify that `pts` forms a non-degenerate, non-self-intersecting simple 2D polygon
    function isSimplePolygon(pts) {
      const n = pts.length;
      if (n < 3) return false;

      // Minimum area check so polygon doesn't collapse into a sliver
      if (Math.abs(polygonSignedArea(pts)) < 1200) return false;

      // Check edge lengths and sharp hairpin turns
      for (let i = 0; i < n; i++) {
        const prev = pts[(i - 1 + n) % n];
        const curr = pts[i];
        const next = pts[(i + 1) % n];

        const ux = prev.x - curr.x;
        const uy = prev.y - curr.y;
        const vx = next.x - curr.x;
        const vy = next.y - curr.y;
        const lenU = Math.hypot(ux, uy);
        const lenV = Math.hypot(vx, vy);

        if (lenU < 8 || lenV < 8) return false;

        // Avoid near-0° or near-180° collapsed turns
        const cosTheta = (ux * vx + uy * vy) / (lenU * lenV);
        if (cosTheta > 0.94 || cosTheta < -0.995) return false;
      }

      // Check all non-adjacent edge pairs for intersection
      for (let i = 0; i < n; i++) {
        const a = pts[i];
        const b = pts[(i + 1) % n];
        for (let j = i + 1; j < n; j++) {
          // Skip adjacent edges (they share a vertex)
          if (j === i || j === (i + 1) % n || i === (j + 1) % n) continue;
          const c = pts[j];
          const d = pts[(j + 1) % n];
          if (segmentsIntersect(a, b, c, d)) return false;
        }
      }
      return true;
    }

    // Enforce the flat 140 mm bottom on points 0 and 1, and compute integer bounds
    function normalizePolygonBounds(pts) {
      const out = pts.map((p, idx) => {
        if (idx === 0) return { x: -HALF_BASE, y: 0 };
        if (idx === 1) return { x:  HALF_BASE, y: 0 };
        return {
          x: clampInt(p.x, -110, 110),
          y: clampInt(p.y, 10, HEIGHT_RANGE[1])
        };
      });

      let minX = Infinity, maxX = -Infinity;
      let minY = Infinity, maxY = -Infinity;
      for (const p of out) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      return {
        profile: out,
        length: Math.max(BASE_LENGTH, Math.round(maxX - minX)),
        height: Math.max(1, Math.round(maxY - minY))
      };
    }

    // Generate a random non-self-intersecting 2D polygon with `n` integer (x, y) vertices
    // where profile[0] = (-70, 0) and profile[1] = (70, 0) form the 140 mm flat bottom
    function generateProfile(n) {
      n = clampInt(n, MIN_POINTS, MAX_POINTS);
      const upperCount = n - 2; // number of points above the 2-point flat base
      const targetL = randInt(LENGTH_RANGE[0], LENGTH_RANGE[1]);
      const targetH = randInt(HEIGHT_RANGE[0], HEIGHT_RANGE[1]);

      for (let attempt = 0; attempt < 80; attempt++) {
        const pts = [
          { x: -HALF_BASE, y: 0 },
          { x:  HALF_BASE, y: 0 }
        ];

        // Generate `upperCount` angles across the upper half-plane (0 to PI, right to left)
        const sector = Math.PI / upperCount;
        for (let i = 0; i < upperCount; i++) {
          const baseAng = (i + 0.5) * sector;
          const jitter = (Math.random() - 0.5) * sector * 0.65;
          const ang = Math.min(Math.PI - 0.12, Math.max(0.12, baseAng + jitter));
          const rFrac = 0.5 + Math.random() * 0.5;
          const x = Math.round(Math.cos(ang) * (targetL * 0.5) * rFrac);
          const y = clampInt(Math.sin(ang) * targetH * rFrac, 14, targetH);
          pts.push({ x, y });
        }

        if (isSimplePolygon(pts)) {
          return normalizePolygonBounds(pts);
        }
      }

      // Fallback arch polygon above the 140 mm base
      const fallback = [
        { x: -HALF_BASE, y: 0 },
        { x:  HALF_BASE, y: 0 }
      ];
      for (let i = 0; i < upperCount; i++) {
        const ang = ((i + 0.5) / upperCount) * Math.PI;
        fallback.push({
          x: Math.round(Math.cos(ang) * HALF_BASE),
          y: Math.max(20, Math.round(Math.sin(ang) * targetH))
        });
      }
      return normalizePolygonBounds(fallback);
    }

    // Genome class representing a car with integer (x, y) profile points
    class Genome {
      constructor(data = null) {
        this.width = FIXED_WIDTH;
        if (data) {
          this.profile = data.profile.map(p => ({
            x: Math.round(p.x),
            y: Math.round(p.y)
          }));
          const norm = normalizePolygonBounds(this.profile);
          this.profile = norm.profile;
          this.length = norm.length;
          this.height = norm.height;
        } else {
          const generated = generateProfile(profilePointCount);
          this.profile = generated.profile;
          this.length = generated.length;
          this.height = generated.height;
        }
      }

      // Create a mutated child using coordinate mutation, vertex deletion, and vertex insertion
      mutate(rate = mutationRate) {
        const child = new Genome(this);

        let pts = child.profile.map(p => ({ x: p.x, y: p.y }));
        // Always lock the first two points as the 140 mm flat bottom at y = 0
        pts[0] = { x: -HALF_BASE, y: 0 };
        pts[1] = { x:  HALF_BASE, y: 0 };

        // 1. Deletion: occasionally remove an upper vertex (index >= 2) if polygon stays valid
        if (pts.length > MIN_POINTS && Math.random() < rate * 0.55) {
          const removable = [];
          for (let i = 2; i < pts.length; i++) removable.push(i);
          removable.sort(() => Math.random() - 0.5);
          for (const idx of removable) {
            const candidate = pts.filter((_, i) => i !== idx);
            if (isSimplePolygon(candidate)) {
              pts = candidate;
              break;
            }
          }
        }

        // 2. Insertion: occasionally split a non-bottom edge (index >= 1) and offset the new integer vertex
        if (pts.length < MAX_POINTS && Math.random() < rate * 0.65) {
          const edges = [];
          for (let i = 1; i < pts.length; i++) edges.push(i); // skip edge 0 (the flat bottom)
          edges.sort(() => Math.random() - 0.5);
          let inserted = false;
          for (const idx of edges) {
            if (inserted) break;
            const a = pts[idx];
            const b = pts[(idx + 1) % pts.length];
            const mx = (a.x + b.x) * 0.5;
            const my = (a.y + b.y) * 0.5;
            const ex = b.x - a.x;
            const ey = b.y - a.y;
            const edgeLen = Math.hypot(ex, ey);
            if (edgeLen < 16) continue;

            // Normal vector to edge
            const nx = -ey / edgeLen;
            const ny =  ex / edgeLen;

            for (let tryNum = 0; tryNum < 8; tryNum++) {
              const offset = (Math.random() - 0.5) * Math.min(50, edgeLen * 0.8) * (0.4 + rate);
              const along = (Math.random() - 0.5) * edgeLen * 0.25;
              const newPt = {
                x: clampInt(mx + nx * offset + (ex / edgeLen) * along, -110, 110),
                y: clampInt(my + ny * offset + (ey / edgeLen) * along, 10, HEIGHT_RANGE[1])
              };
              const candidate = pts.slice();
              candidate.splice(idx + 1, 0, newPt);
              if (isSimplePolygon(candidate)) {
                pts = candidate;
                inserted = true;
                break;
              }
            }
          }
        }

        // 3. Coordinate modification: nudge upper integer (x, y) pairs (index >= 2) while preserving non-self-intersection
        const stepX = Math.max(3, Math.round(28 * rate));
        const stepY = Math.max(3, Math.round(24 * rate));
        for (let i = 2; i < pts.length; i++) {
          if (Math.random() < 0.75) {
            for (let tryNum = 0; tryNum < 6; tryNum++) {
              const dx = Math.round(gauss() * stepX);
              const dy = Math.round(gauss() * stepY);
              if (dx === 0 && dy === 0) continue;
              const prevPt = pts[i];
              pts[i] = {
                x: clampInt(prevPt.x + dx, -110, 110),
                y: clampInt(prevPt.y + dy, 10, HEIGHT_RANGE[1])
              };
              if (isSimplePolygon(pts)) {
                break;
              } else {
                pts[i] = prevPt;
              }
            }
          }
        }

        const norm = normalizePolygonBounds(pts);
        child.profile = norm.profile;
        child.length = norm.length;
        child.height = norm.height;
        return child;
      }
    }

    // --- geometry builder: extrude the non-self-intersecting 2D polygon along width ---
    function buildCarGeometry(genome) {
      const { width: W, profile } = genome;
      const n = profile.length;
      if (n < 3) return new THREE.BufferGeometry();

      // Build THREE.Shape from the integer 2D polygon so Three.js ear-clipping
      // properly triangulates concave & convex profiles without any stray faces
      const shape = new THREE.Shape();
      shape.moveTo(profile[0].x, profile[0].y);
      for (let i = 1; i < n; i++) {
        shape.lineTo(profile[i].x, profile[i].y);
      }
      shape.closePath();

      const extrudeSettings = {
        depth: W,
        bevelEnabled: false,
        steps: 1
      };

      const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      // Center extrusion along Z axis (-W/2 to +W/2)
      geometry.translate(0, 0, -W / 2);
      geometry.computeVertexNormals();

      return geometry;
    }

    // --- shared low-poly octagonal wheel geometry & material (preview only, not exported) ---
    let sharedWheelGeometry = null;
    let sharedWheelMaterial = null;

    function getWheelAssets() {
      if (!sharedWheelGeometry) {
        const radius = 20; // 40 mm diameter
        const tireWidth = 14;
        const octShape = new THREE.Shape();
        for (let i = 0; i < 8; i++) {
          // Rotate by PI/8 so top and bottom edges of the octagon are flat on the ground
          const ang = (i / 8) * Math.PI * 2 + Math.PI / 8;
          const x = Math.cos(ang) * radius;
          const y = Math.sin(ang) * radius;
          if (i === 0) octShape.moveTo(x, y);
          else octShape.lineTo(x, y);
        }
        octShape.closePath();

        sharedWheelGeometry = new THREE.ExtrudeGeometry(octShape, {
          depth: tireWidth,
          bevelEnabled: false,
          steps: 1
        });
        sharedWheelGeometry.translate(0, 0, -tireWidth / 2);
        sharedWheelGeometry.computeVertexNormals();

        sharedWheelMaterial = new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHSL(0, 0, 0.4),
          flatShading: true,
          roughness: 0.7,
          metalness: 0.1,
          side: THREE.DoubleSide
        });
      }
      return { geometry: sharedWheelGeometry, material: sharedWheelMaterial };
    }

    function createPreviewWheels(bodyWidth = FIXED_WIDTH) {
      const { geometry, material } = getWheelAssets();
      const wheelGroup = new THREE.Group();
      const halfW = bodyWidth / 2;
      // Place wheels at (-50, 0) and (50, 0), straddling the side faces of the extrusion
      const zOffset = halfW - 2; // intersects the car body side wall and protrudes slightly
      const positions = [
        [-50, 0, -zOffset],
        [-50, 0,  zOffset],
        [ 50, 0, -zOffset],
        [ 50, 0,  zOffset]
      ];
      for (const [wx, wy, wz] of positions) {
        const tire = new THREE.Mesh(geometry, material);
        tire.position.set(wx, wy, wz);
        wheelGroup.add(tire);
      }
      return wheelGroup;
    }

    // --- selection & breeding logic ---
    function selectCell(index) {
      selectedIndex = index;
      
      // update highlight

        cell.element.classList.toggle('selected', i === index);
      });
      
      // enable export & net buttons
      exportBtn.disabled = false;
      netBtn.disabled = false;
      
      // add current genome to history (if not already the last one)
      const selectedGenome = genomes[index];
      // We want to record the genome state when selected.
      // To avoid duplicates if clicking same cell multiple times, we can check if
      // the last history item is the same genome (by reference or content).
      // For simplicity, we'll just add it if it's a new object.
      // But since genomes[index] might be the same object as before, we can store a clone.
      // Actually we want to capture the current genome.
      // Let's store a copy to avoid later mutations affecting history.
      const historyEntry = {
        genome: new Genome(selectedGenome), // deep copy
        sourceIndex: index,
        timestamp: Date.now()
      };
      
      // Avoid exact duplicates (same dimensions and profile length? not robust, but fine)
      const last = history[history.length - 1];
      const isDuplicate = last && 
        Math.abs(last.genome.length - historyEntry.genome.length) < 0.01 &&
        Math.abs(last.genome.width - historyEntry.genome.width) < 0.01 &&
        Math.abs(last.genome.height - historyEntry.genome.height) < 0.01 &&
        last.genome.profile.length === historyEntry.genome.profile.length;
      
      if (!isDuplicate) {
        history.push(historyEntry);
      }
      
      // update history display
      renderHistory();
      
      // breed variations in other cells
      for (let i = 0; i < cells.length; i++) {
        if (i === index) continue;
        const mutated = selectedGenome.mutate(mutationRate);
        genomes[i] = mutated;
        cells[i].updateCar(mutated);
      }
      
      // ensure the selected cell's genome remains intact
      genomes[index] = selectedGenome;
    }

    function generateSafeFileName() {
      const chosen = [];
      while (chosen.length < 3) {
        const word = SAFE_WORDS[Math.floor(Math.random() * SAFE_WORDS.length)];
        if (/^[a-z]+$/.test(word) && !chosen.includes(word)) {
          chosen.push(word);
        }
      }
      return chosen.join('_');
    }

    function geometryToASCIISTL(geometry, name = 'genetic_car') {
      const nonIndexed = geometry.index ? geometry.toNonIndexed() : geometry.clone();
      nonIndexed.computeVertexNormals();
      const pos = nonIndexed.getAttribute('position');
      const lines = [`solid ${name}`];
      const vA = new THREE.Vector3();
      const vB = new THREE.Vector3();
      const vC = new THREE.Vector3();
      const cb = new THREE.Vector3();
      const ab = new THREE.Vector3();

      for (let i = 0; i < pos.count; i += 3) {
        vA.fromBufferAttribute(pos, i);
        vB.fromBufferAttribute(pos, i + 1);
        vC.fromBufferAttribute(pos, i + 2);
        cb.subVectors(vC, vB);
        ab.subVectors(vA, vB);
        cb.cross(ab).normalize();

        lines.push(`  facet normal ${cb.x.toExponential(6)} ${cb.y.toExponential(6)} ${cb.z.toExponential(6)}`);
        lines.push('    outer loop');
        lines.push(`      vertex ${vA.x.toExponential(6)} ${vA.y.toExponential(6)} ${vA.z.toExponential(6)}`);
        lines.push(`      vertex ${vB.x.toExponential(6)} ${vB.y.toExponential(6)} ${vB.z.toExponential(6)}`);
        lines.push(`      vertex ${vC.x.toExponential(6)} ${vC.y.toExponential(6)} ${vC.z.toExponential(6)}`);
        lines.push('    endloop');
        lines.push('  endfacet');
      }
      lines.push(`endsolid ${name}`);
      nonIndexed.dispose();
      return lines.join('\n');
    }

    // --- 2D Polygon Net Generator & Viewer ---
    function buildCarNetSVG(genome, { layout = 'connected', includeTabs = true, includeLabels = true } = {}) {
      const W = genome.width; // 80 mm
      const pts = genome.profile;
      const n = pts.length;
      const carName = getGenomeExportName(genome);

      // Compute edge lengths and cumulative X positions along the unfolded perimeter strip
      // Edge i connects pts[i] -> pts[(i + 1) % n]
      // Note: Edge 0 connects pts[0] (-70, 0) -> pts[1] (70, 0), length = 140 mm
      const edges = [];
      let totalPerimeter = 0;
      for (let i = 0; i < n; i++) {
        const a = pts[i];
        const b = pts[(i + 1) % n];
        const len = Math.hypot(b.x - a.x, b.y - a.y);
        edges.push({
          index: i,
          a,
          b,
          length: len,
          x0: totalPerimeter,
          x1: totalPerimeter + len
        });
        totalPerimeter += len;
      }

      const cutPaths = [];
      const foldLines = [];
      const labelElements = [];

      let minX = Infinity, maxX = -Infinity;
      let minY = Infinity, maxY = -Infinity;
      function trackPoint(x, y) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }

      const tabDepth = 10; // 10 mm glue tab depth
      const tabBevel = 7;  // 7 mm bevel inset

      if (layout === 'connected') {
        // Center strip spans X in [0, totalPerimeter], Y in [0, W]
        // Panel 0 (Base: X in [0, 140], Y in [0, W]) has the two side polygons attached at Y = 0 and Y = W:
        //   - Top Side Polygon folds upward into Y <= 0: point (px, py) -> (X = px + HALF_BASE, Y = -py)
        //   - Bottom Side Polygon folds downward into Y >= W: point (px, py) -> (X = px + HALF_BASE, Y = W + py)
        const baseLen = edges[0].length; // 140 mm

        // Fold lines along the base where the two side polygons attach
        foldLines.push({ x1: 0, y1: 0, x2: baseLen, y2: 0 });
        foldLines.push({ x1: 0, y1: W, x2: baseLen, y2: W });

        // Interior vertical fold lines between strip panels 0..n-1
        for (let i = 1; i < n; i++) {
          const x = edges[i].x0;
          foldLines.push({ x1: x, y1: 0, x2: x, y2: W });
        }

        // Left vertical cut at X = 0 (from Y = 0 to Y = W)
        cutPaths.push(`M 0 0 L 0 ${W}`);

        // Top Side Polygon outer cut path (from pts[0] at (0,0) through pts[n-1]..pts[2] to pts[1] at (140,0))
        const topPolyPts = [];
        for (let i = 0; i < n; i++) {
          const ux = pts[i].x + HALF_BASE;
          const uy = -pts[i].y;
          topPolyPts.push({ x: ux, y: uy });
          trackPoint(ux, uy);
        }
        // Trace from index 1 -> 2 -> ... -> n-1 -> 0 so we don't cut the fold line 0 -> 1
        let topD = `M ${topPolyPts[1].x.toFixed(2)} ${topPolyPts[1].y.toFixed(2)}`;
        for (let i = 2; i <= n; i++) {
          const p = topPolyPts[i % n];
          topD += ` L ${p.x.toFixed(2)} ${p.y.toFixed(2)}`;
        }
        cutPaths.push(topD);

        // Bottom Side Polygon outer cut path (Y >= W)
        const botPolyPts = [];
        for (let i = 0; i < n; i++) {
          const ux = pts[i].x + HALF_BASE;
          const uy = W + pts[i].y;
          botPolyPts.push({ x: ux, y: uy });
          trackPoint(ux, uy);
        }
        let botD = `M ${botPolyPts[1].x.toFixed(2)} ${botPolyPts[1].y.toFixed(2)}`;
        for (let i = 2; i <= n; i++) {
          const p = botPolyPts[i % n];
          botD += ` L ${p.x.toFixed(2)} ${p.y.toFixed(2)}`;
        }
        cutPaths.push(botD);

        // Strip panels 1 .. n-1 top and bottom edges (with optional glue tabs)
        for (let i = 1; i < n; i++) {
          const { x0, x1, length } = edges[i];
          trackPoint(x0, 0);
          trackPoint(x1, W);

          if (includeTabs && length >= 16) {
            const bev = Math.min(tabBevel, length * 0.3);
            // Top glue tab (folds up from Y = 0 to Y = -tabDepth)
            cutPaths.push(
              `M ${x0.toFixed(2)} 0 L ${(x0 + bev).toFixed(2)} ${(-tabDepth).toFixed(2)} ` +
              `L ${(x1 - bev).toFixed(2)} ${(-tabDepth).toFixed(2)} L ${x1.toFixed(2)} 0`
            );
            foldLines.push({ x1: x0, y1: 0, x2: x1, y2: 0 });
            trackPoint(x0, -tabDepth);
            trackPoint(x1, -tabDepth);

            // Bottom glue tab (folds down from Y = W to Y = W + tabDepth)
            cutPaths.push(
              `M ${x0.toFixed(2)} ${W} L ${(x0 + bev).toFixed(2)} ${(W + tabDepth).toFixed(2)} ` +
              `L ${(x1 - bev).toFixed(2)} ${(W + tabDepth).toFixed(2)} L ${x1.toFixed(2)} ${W}`
            );
            foldLines.push({ x1: x0, y1: W, x2: x1, y2: W });
            trackPoint(x0, W + tabDepth);
            trackPoint(x1, W + tabDepth);
          } else {
            cutPaths.push(`M ${x0.toFixed(2)} 0 L ${x1.toFixed(2)} 0`);
            cutPaths.push(`M ${x0.toFixed(2)} ${W} L ${x1.toFixed(2)} ${W}`);
          }
        }

        // Right end of the perimeter strip at X = totalPerimeter
        if (includeTabs) {
          const endX = totalPerimeter;
          foldLines.push({ x1: endX, y1: 0, x2: endX, y2: W });
          cutPaths.push(
            `M ${endX.toFixed(2)} 0 L ${(endX + tabDepth).toFixed(2)} ${tabBevel} ` +
            `L ${(endX + tabDepth).toFixed(2)} ${(W - tabBevel)} L ${endX.toFixed(2)} ${W}`
          );
          trackPoint(endX + tabDepth, 0);
          trackPoint(endX + tabDepth, W);
        } else {
          cutPaths.push(`M ${totalPerimeter.toFixed(2)} 0 L ${totalPerimeter.toFixed(2)} ${W}`);
        }

        // Labels & matching edge numbers
        if (includeLabels) {
          labelElements.push({
            x: baseLen / 2,
            y: W / 2 - 4,
            text: carName,
            size: 6.5
          });
          labelElements.push({
            x: baseLen / 2,
            y: W / 2 + 6,
            text: `BASE ${ genome.length }×${ genome.width }×${ genome.height } mm`,
            size: 4.5
          });

          for (let i = 1; i < n; i++) {
            const e = edges[i];
            const midStripX = (e.x0 + e.x1) / 2;
            labelElements.push({
              x: midStripX,
              y: W / 2 + 1.5,
              text: `${i} (${Math.round(e.length)}mm)`,
              size: 4.2
            });

            // Matching edge numbers along the top & bottom side polygons
            const pA = topPolyPts[i];
            const pB = topPolyPts[(i + 1) % n];
            const mx = (pA.x + pB.x) / 2;
            const my = (pA.y + pB.y) / 2;
            // Nudge slightly inward toward polygon interior
            const cx = baseLen / 2;
            const cyTop = -genome.height * 0.35;
            const dx = cx - mx, dy = cyTop - my;
            const dLen = Math.hypot(dx, dy) || 1;
            labelElements.push({
              x: mx + (dx / dLen) * 7,
              y: my + (dy / dLen) * 7 + 1.5,
              text: `${i}`,
              size: 4.2
            });

            const qA = botPolyPts[i];
            const qB = botPolyPts[(i + 1) % n];
            const bmx = (qA.x + qB.x) / 2;
            const bmy = (qA.y + qB.y) / 2;
            const cyBot = W + genome.height * 0.35;
            const bdx = cx - bmx, bdy = cyBot - bmy;
            const bdLen = Math.hypot(bdx, bdy) || 1;
            labelElements.push({
              x: bmx + (bdx / bdLen) * 7,
              y: bmy + (bdy / bdLen) * 7 + 1.5,
              text: `${i}`,
              size: 4.2
            });
          }
        }
      } else {
        // Separate Panels layout:
        // 1. Unfolded Perimeter Strip on top (Y in [0, W], X in [0, totalPerimeter])
        trackPoint(0, 0);
        trackPoint(totalPerimeter, W);

        for (let i = 1; i < n; i++) {
          const x = edges[i].x0;
          foldLines.push({ x1: x, y1: 0, x2: x, y2: W });
        }

        if (includeTabs) {
          // Top & bottom glue tabs on all strip panels 0..n-1
          for (let i = 0; i < n; i++) {
            const { x0, x1, length } = edges[i];
            if (length >= 16) {
              const bev = Math.min(tabBevel, length * 0.3);
              cutPaths.push(
                `M ${x0.toFixed(2)} 0 L ${(x0 + bev).toFixed(2)} ${(-tabDepth).toFixed(2)} ` +
                `L ${(x1 - bev).toFixed(2)} ${(-tabDepth).toFixed(2)} L ${x1.toFixed(2)} 0`
              );
              foldLines.push({ x1: x0, y1: 0, x2: x1, y2: 0 });
              cutPaths.push(
                `M ${x0.toFixed(2)} ${W} L ${(x0 + bev).toFixed(2)} ${(W + tabDepth).toFixed(2)} ` +
                `L ${(x1 - bev).toFixed(2)} ${(W + tabDepth).toFixed(2)} L ${x1.toFixed(2)} ${W}`
              );
              foldLines.push({ x1: x0, y1: W, x2: x1, y2: W });
              trackPoint(x0, -tabDepth);
              trackPoint(x1, W + tabDepth);
            } else {
              cutPaths.push(`M ${x0.toFixed(2)} 0 L ${x1.toFixed(2)} 0`);
              cutPaths.push(`M ${x0.toFixed(2)} ${W} L ${x1.toFixed(2)} ${W}`);
            }
          }
          cutPaths.push(`M 0 0 L 0 ${W}`);
          foldLines.push({ x1: totalPerimeter, y1: 0, x2: totalPerimeter, y2: W });
          cutPaths.push(
            `M ${totalPerimeter.toFixed(2)} 0 L ${(totalPerimeter + tabDepth).toFixed(2)} ${tabBevel} ` +
            `L ${(totalPerimeter + tabDepth).toFixed(2)} ${(W - tabBevel)} L ${totalPerimeter.toFixed(2)} ${W}`
          );
          trackPoint(totalPerimeter + tabDepth, W);
        } else {
          cutPaths.push(`M 0 0 L ${totalPerimeter.toFixed(2)} 0 L ${totalPerimeter.toFixed(2)} ${W} L 0 ${W} Z`);
        }

        // 2. Two separate side profile polygons placed below the strip
        let polyMinX = Infinity, polyMaxX = -Infinity;
        for (const p of pts) {
          if (p.x < polyMinX) polyMinX = p.x;
          if (p.x > polyMaxX) polyMaxX = p.x;
        }
        const polyWidth = polyMaxX - polyMinX;
        const rowY = W + (includeTabs ? tabDepth : 0) + 18 + genome.height;

        // Left side polygon
        const leftOffsetX = -polyMinX;
        const leftPts = pts.map(p => ({ x: p.x + leftOffsetX, y: rowY - p.y }));
        leftPts.forEach(p => trackPoint(p.x, p.y));
        cutPaths.push(
          'M ' + leftPts.map(p => `${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(' L ') + ' Z'
        );

        // Right side polygon (mirrored horizontally)
        const rightOffsetX = polyWidth + 20 + polyMaxX;
        const rightPts = pts.map(p => ({ x: rightOffsetX - p.x, y: rowY - p.y }));
        rightPts.forEach(p => trackPoint(p.x, p.y));
        cutPaths.push(
          'M ' + rightPts.map(p => `${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(' L ') + ' Z'
        );

        if (includeLabels) {
          labelElements.push({
            x: edges[0].length / 2,
            y: W / 2 - 3,
            text: carName,
            size: 6
          });
          for (let i = 0; i < n; i++) {
            const e = edges[i];
            labelElements.push({
              x: (e.x0 + e.x1) / 2,
              y: W / 2 + 5,
              text: `${i} (${Math.round(e.length)}mm)`,
              size: 4.2
            });
          }
          labelElements.push({
            x: leftOffsetX,
            y: rowY - genome.height * 0.35,
            text: 'LEFT SIDE',
            size: 5
          });
          labelElements.push({
            x: rightOffsetX,
            y: rowY - genome.height * 0.35,
            text: 'RIGHT SIDE',
            size: 5
          });
        }
      }

      const margin = 12;
      const vx = minX - margin;
      const vy = minY - margin;
      const vw = (maxX - minX) + margin * 2;
      const vh = (maxY - minY) + margin * 2;

      const svgLines = [
        `<?xml version="1.0" encoding="UTF-8"?>`,
        `<svg xmlns="http://www.w3.org/2000/svg" width="${vw.toFixed(2)}mm" height="${vh.toFixed(2)}mm" viewBox="${vx.toFixed(2)} ${vy.toFixed(2)} ${vw.toFixed(2)} ${vh.toFixed(2)}">`,
        `  <g id="score-fold-lines" fill="none" stroke="#33aaff" stroke-width="0.45" stroke-dasharray="3,2">`
      ];

      for (const fl of foldLines) {
        svgLines.push(`    <line x1="${fl.x1.toFixed(2)}" y1="${fl.y1.toFixed(2)}" x2="${fl.x2.toFixed(2)}" y2="${fl.y2.toFixed(2)}" />`);
      }
      svgLines.push(`  </g>`);

      svgLines.push(`  <g id="cut-lines" fill="none" stroke="#ff3333" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round">`);
      for (const d of cutPaths) {
        svgLines.push(`    <path d="${d}" />`);
      }
      svgLines.push(`  </g>`);

      if (labelElements.length > 0) {
        svgLines.push(`  <g id="labels" fill="#ffaa66" font-family="monospace, sans-serif" text-anchor="middle">`);
        for (const lbl of labelElements) {
          svgLines.push(`    <text x="${lbl.x.toFixed(2)}" y="${lbl.y.toFixed(2)}" font-size="${lbl.size}">${lbl.text}</text>`);
        }
        svgLines.push(`  </g>`);
      }

      svgLines.push(`</svg>`);

      return {
        svg: svgLines.join('\n'),
        widthMm: Math.round(vw),
        heightMm: Math.round(vh),
        perimeterMm: Math.round(totalPerimeter),
        carName
      };
    }

    function updateNetModalPreview() {
      if (selectedIndex < 0 || !genomes[selectedIndex]) return;
      const g = genomes[selectedIndex];
      const result = buildCarNetSVG(g, {
        layout: netLayoutSelect.value,
        includeTabs: netTabsChk.checked,
        includeLabels: netLabelsChk.checked
      });
      netViewport.innerHTML = result.svg;
      netDimensionsInfo.textContent =
        `${result.carName}.svg · Sheet: ${result.widthMm} × ${result.heightMm} mm · Strip perimeter: ${result.perimeterMm} mm`;
    }

    netBtn.addEventListener('click', () => {
      if (selectedIndex < 0 || !genomes[selectedIndex]) return;
      updateNetModalPreview();
      netModal.classList.add('open');
    });

    netLayoutSelect.addEventListener('change', updateNetModalPreview);
    netTabsChk.addEventListener('change', updateNetModalPreview);
    netLabelsChk.addEventListener('change', updateNetModalPreview);

    netDownloadBtn.addEventListener('click', () => {
      if (selectedIndex < 0 || !genomes[selectedIndex]) return;
      const g = genomes[selectedIndex];
      const result = buildCarNetSVG(g, {
        layout: netLayoutSelect.value,
        includeTabs: netTabsChk.checked,
        includeLabels: netLabelsChk.checked
      });
      const blob = new Blob([result.svg], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${result.carName}.svg`;
      a.click();
      URL.revokeObjectURL(url);
    });

    netCloseBtn.addEventListener('click', () => {
      netModal.classList.remove('open');
    });

    netModal.addEventListener('click', (e) => {
      if (e.target === netModal) netModal.classList.remove('open');
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && netModal.classList.contains('open')) {
        netModal.classList.remove('open');
      }
    });

    // --- toolbar controls ---
    pauseBtn.addEventListener('click', () => {
      isRotationPaused = !isRotationPaused;
      pauseBtn.classList.toggle('active', isRotationPaused);
      pauseBtn.textContent = isRotationPaused ? '▶️ Resume Rotation' : '⏸️ Pause Rotation';
    });

    reseedBtn.addEventListener('click', () => {
      selectedIndex = -1;
      exportBtn.disabled = true;
      netBtn.disabled = true;
      cells.forEach(c => c.element.classList.remove('selected'));
      initGenomes();
      updateAllCells();
    });

    pointsSlider.addEventListener('input', () => {
      profilePointCount = parseInt(pointsSlider.value, 10);
      pointsValue.textContent = String(profilePointCount);
      selectedIndex = -1;
      exportBtn.disabled = true;
      netBtn.disabled = true;
      cells.forEach(c => c.element.classList.remove('selected'));
      initGenomes();
      updateAllCells();
    });

    mutationSlider.addEventListener('input', () => {
      const pct = parseInt(mutationSlider.value, 10);
      mutationRate = pct / 100;
      mutationValue.textContent = `${pct}%`;
    });

    // initialize history UI
    renderHistory();

    // --- animation loop ---
    function animate() {
      requestAnimationFrame(animate);

      if (!isRotationPaused) {
        currentRotationY += 0.008;
      }

      cells.forEach((cell) => {
        if (cell.carMesh) {
          cell.carMesh.rotation.y = currentRotationY;
        }
        cell.renderer.render(cell.scene, cell.camera);
      });
    }

    animate();
  </script>
</body>
</html>
