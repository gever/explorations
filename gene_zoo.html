<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gene Garden</title>
<!--
DeepSeek prompt:
We are playing with genetics, using a floating point array as a representation of a gene.
Each pair of numbers in the array should be treated as a coordinate pair.
The arrays are seeded with random numbers.
Nine canvases on the screen represent nine genes.
The coordinates are normalized and drawn to fit in the box.
Clicking on a box will copy that gene to the other eight canvases with some level of mutation as set in a slider.
Possible mutations include modification of values, insertion of new values, and deletion of existing values.
Each canvas enforces bilateral symmetry by reflecting the left half onto the right half.
Initially, the genes are between 16 and 64 pairs long.
Each time the user clicks on a canvas, a copy of that canvas appears in a timeline along the bottom of the display.
This should be written in a single HTML file using JavaScript and CSS as needed.
-->
<style>
  :root{
    --bg:#080a0f;
    --line:#1b2331;
    --ink:#c9d4e6;
    --dim:#63708a;
    --accent:#6ee7ff;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:radial-gradient(1200px 700px at 50% -10%, #121a28 0%, var(--bg) 60%);
    color:var(--ink);
    font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    height:100vh;
    height:100dvh;
  }

  /* ---------- header ---------- */
  header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(#0c111a,#0a0e15);
  }
  h1{
    margin:0;
    font-size:12px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:#8fa2c0;
    font-weight:600;
    white-space:nowrap;
  }
  .ctl{ display:flex; align-items:center; gap:9px; color:var(--dim); white-space:nowrap; }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:150px; height:3px; border-radius:2px;
    background:#1e2839; outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:13px; height:13px; border-radius:50%;
    background:var(--accent); cursor:pointer;
    box-shadow:0 0 10px rgba(110,231,255,.7);
  }
  input[type=range]::-moz-range-thumb{
    width:13px; height:13px; border:none; border-radius:50%;
    background:var(--accent); cursor:pointer;
    box-shadow:0 0 10px rgba(110,231,255,.7);
  }
  output{ min-width:40px; color:var(--accent); }
  button{
    font:inherit; color:#9fb3d1; background:#141b26;
    border:1px solid var(--line); border-radius:5px;
    padding:5px 11px; cursor:pointer;
    transition:color .15s, border-color .15s, background .15s;
    white-space:nowrap;
  }
  button:hover{ color:#fff; border-color:#33445e; }
  #mode{
    min-width:84px;
    color:var(--accent);
    border-color:#26445c;
    background:#0f1a25;
  }
  #mode:hover{ color:#fff; border-color:#3f6b8f; }
  .hint{ margin-left:auto; color:#4b5871; font-size:11px; white-space:nowrap; }
  @media (max-width:900px){ .hint{ display:none; } }

  /* ---------- 3x3 grid of genes ---------- */
  #grid{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:8px;
    padding:8px;
  }
  .cell{
    position:relative;
    border:1px solid var(--line);
    border-radius:9px;
    overflow:hidden;
    cursor:pointer;
    background:radial-gradient(circle at 50% 45%,#10161f,#080b10 72%);
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  .cell:hover{
    border-color:#3a4d6b;
    box-shadow:0 0 0 1px rgba(110,231,255,.15), 0 0 24px rgba(110,231,255,.08);
  }
  .cell canvas{ display:block; width:100%; height:100%; }

  @keyframes flash{
    0%   { box-shadow:inset 0 0 60px rgba(110,231,255,.45); border-color:var(--accent); }
    100% { box-shadow:inset 0 0 0 rgba(110,231,255,0); }
  }
  .cell.flash{ animation:flash .5s ease-out; }

  /* ---------- timeline ---------- */
  #timeline{
    flex:0 0 auto;
    height:116px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border-top:1px solid var(--line);
    background:#070a0e;
    overflow-x:auto;
    overflow-y:hidden;
  }
  #timeline:empty::before{
    content:"snapshots of every click appear here \2014 click one to reload it";
    color:#38445a;
    font-size:11px;
    letter-spacing:.06em;
  }
  .snap{
    flex:0 0 auto;
    position:relative;
    width:88px; height:88px;
    border:1px solid var(--line);
    border-radius:7px;
    overflow:hidden;
    background:radial-gradient(circle at 50% 45%,#10161f,#080b10 72%);
    cursor:pointer;
    transition:border-color .15s, transform .15s;
  }
  .snap:hover{ border-color:#41597a; transform:translateY(-2px); }
  .snap canvas{ display:block; width:100%; height:100%; }
  .snap span{
    position:absolute; right:4px; bottom:2px;
    font-size:9px; color:#4a5871; pointer-events:none;
  }
  #timeline::-webkit-scrollbar{ height:6px; }
  #timeline::-webkit-scrollbar-track{ background:transparent; }
  #timeline::-webkit-scrollbar-thumb{ background:#1e2839; border-radius:3px; }
</style>
</head>
<body>

<header>
  <h1>Gene Garden</h1>
  <label class="ctl">
    mutation
    <input id="rate" type="range" min="0" max="1" step="0.01" value="0.25">
    <output id="rateOut">25%</output>
  </label>
  <button id="mode" title="toggle between curved and straight-line rendering">curves</button>
  <button id="reset">reseed</button>
  <span class="hint">click a canvas to breed it into the other eight</span>
</header>

<main id="grid"></main>
<div id="timeline"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     CONSTANTS
     ============================================================ */
  const HUES      = [200, 160, 130, 265, 300, 330, 20, 45, 90];
  const MIN_PAIRS = 4;     // never delete below this many coordinate pairs
  const MAX_PAIRS = 128;   // never insert above this many coordinate pairs
  const MAX_SNAPS = 60;    // timeline keeps at most this many thumbnails

  /* ============================================================
     DOM
     ============================================================ */
  const gridEl     = document.getElementById('grid');
  const timelineEl = document.getElementById('timeline');
  const rateEl     = document.getElementById('rate');
  const rateOut    = document.getElementById('rateOut');
  const resetBtn   = document.getElementById('reset');
  const modeBtn    = document.getElementById('mode');

  let cells   = [];        // [{el, canvas}, ...] x9
  let genes   = [];        // 9 float arrays, each [x0,y0,x1,y1,...]
  let snapSeq = 0;
  const snapshots = [];    // [{gene, hue, canvas}] so mode changes can redraw them

  /* 'curves' | 'lines' — read by every draw call */
  let renderMode = 'curves';

  /* ============================================================
     MATH HELPERS
     ============================================================ */
  function gauss() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // Reflect a value back into [-1, 1] (soft "bounce" at the walls)
  function fold(v) {
    let guard = 0;
    while ((v > 1 || v < -1) && guard++ < 24) {
      v = v > 1 ? 2 - v : -2 - v;
    }
    return v < -1 ? -1 : v > 1 ? 1 : v;
  }

  /* ============================================================
     GENE CREATION
     Each gene is a flat float array: pairs of (x, y) in [-1, 1].
     A bounded random walk gives organic, non-jittery shapes.
     ============================================================ */
  function randomGene() {
    const pairs = 16 + Math.floor(Math.random() * 49);   // 16 .. 64 pairs
    const a = new Array(pairs * 2);
    let x = (Math.random() * 2 - 1) * 0.6;
    let y = (Math.random() * 2 - 1) * 0.6;
    const step = 0.22 + Math.random() * 0.45;

    for (let i = 0; i < pairs; i++) {
      a[i * 2]     = x;
      a[i * 2 + 1] = y;
      x = fold(x + (Math.random() * 2 - 1) * step);
      y = fold(y + (Math.random() * 2 - 1) * step);
    }
    return a;
  }

  /* ============================================================
     MUTATION
     1. value modification  — gaussian nudges on individual floats
     2. insertion           — new coordinate pairs spliced in
     3. deletion            — existing coordinate pairs removed
     All three are scaled by the mutation-rate slider.
     ============================================================ */
  function mutate(gene, rate) {
    const a = Array.from(gene);

    /* --- 1. modify existing values --- */
    const pMod = rate * 0.55;
    if (pMod > 0) {
      for (let i = 0; i < a.length; i++) {
        if (Math.random() < pMod) {
          a[i] = fold(a[i] + gauss() * 0.30 * (0.25 + rate));
        }
      }
    }

    /* --- 2. insertions --- */
    const nIns = Math.floor(Math.random() * rate * 5);
    for (let k = 0; k < nIns; k++) {
      const pairs = a.length / 2;
      if (pairs >= MAX_PAIRS) break;

      const slot = Math.floor(Math.random() * (pairs + 1));
      let nx, ny;

      if (slot === 0) {                       // prepend
        nx = a[0] + gauss() * 0.2;
        ny = a[1] + gauss() * 0.2;
      } else if (slot === pairs) {            // append
        nx = a[2 * pairs - 2] + gauss() * 0.2;
        ny = a[2 * pairs - 1] + gauss() * 0.2;
      } else {                                // interpolate between neighbours
        const t = Math.random();
        nx = a[2 * slot - 2] * (1 - t) + a[2 * slot] * t + gauss() * 0.08;
        ny = a[2 * slot - 1] * (1 - t) + a[2 * slot + 1] * t + gauss() * 0.08;
      }
      a.splice(slot * 2, 0, fold(nx), fold(ny));
    }

    /* --- 3. deletions --- */
    const nDel = Math.floor(Math.random() * rate * 5);
    for (let k = 0; k < nDel; k++) {
      const pairs = a.length / 2;
      if (pairs <= MIN_PAIRS) break;
      const idx = Math.floor(Math.random() * pairs);
      a.splice(idx * 2, 2);
    }

    return a;
  }

  /* ============================================================
     SYMMETRY
     The left half of the point list is reflected onto the right
     half, so every drawing is bilaterally symmetric about x = 0.
     ============================================================ */
  function genePoints(gene) {
    const n = gene.length >> 1;
    const pts = new Array(n);
    for (let i = 0; i < n; i++) pts[i] = [gene[i * 2], gene[i * 2 + 1]];

    const half = n >> 1;
    for (let i = 0; i < half; i++) {
      pts[n - 1 - i] = [-pts[i][0], pts[i][1]];   // mirror across x = 0
    }
    if (n & 1) pts[half][0] = 0;                  // middle point sits on the axis
    return pts;
  }

  /* ============================================================
     PATH BUILDING — straight lines or smooth closed curves
     The curve mode uses quadratic segments through segment midpoints,
     which produces a smooth, closed, C1-ish loop.
     ============================================================ */
  function buildPath(ctx, pts, toX, toY) {
    const n = pts.length;
    ctx.beginPath();
    if (n === 0) return;

    if (renderMode === 'lines' || n < 3) {
      ctx.moveTo(toX(pts[0]), toY(pts[0]));
      for (let i = 1; i < n; i++) ctx.lineTo(toX(pts[i]), toY(pts[i]));
      ctx.closePath();
      return;
    }

    // start at the midpoint between the last and first point
    let mx = (toX(pts[n - 1]) + toX(pts[0])) / 2;
    let my = (toY(pts[n - 1]) + toY(pts[0])) / 2;
    ctx.moveTo(mx, my);

    for (let i = 0; i < n; i++) {
      const p = pts[i];
      const q = pts[(i + 1) % n];
      mx = (toX(p) + toX(q)) / 2;
      my = (toY(p) + toY(q)) / 2;
      ctx.quadraticCurveTo(toX(p), toY(p), mx, my);
    }
    ctx.closePath();
  }

  /* ============================================================
     RENDERING
     ============================================================ */
  function drawGene(canvas, gene, hue) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth  || 160;
    const h = canvas.clientHeight || 160;

    const pw = Math.max(1, Math.round(w * dpr));
    const ph = Math.max(1, Math.round(h * dpr));
    if (canvas.width !== pw || canvas.height !== ph) {
      canvas.width  = pw;
      canvas.height = ph;
    }

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const pts = genePoints(gene);
    if (!pts.length) return;

    /* --- normalise: fit the point cloud into the box --- */
    let minX =  Infinity, maxX = -Infinity;
    let minY =  Infinity, maxY = -Infinity;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      if (p[0] < minX) minX = p[0];
      if (p[0] > maxX) maxX = p[0];
      if (p[1] < minY) minY = p[1];
      if (p[1] > maxY) maxY = p[1];
    }

    const pad = Math.min(w, h) * 0.10;
    const bw  = Math.max(maxX - minX, 1e-4);
    const bh  = Math.max(maxY - minY, 1e-4);
    const s   = Math.min((w - 2 * pad) / bw, (h - 2 * pad) / bh);
    const cx  = (minX + maxX) / 2;
    const cy  = (minY + maxY) / 2;
    const ox  = w / 2;
    const oy  = h / 2;

    const toX = p => ox + (p[0] - cx) * s;
    const toY = p => oy + (p[1] - cy) * s;

    /* --- path --- */
    buildPath(ctx, pts, toX, toY);

    ctx.fillStyle = 'hsla(' + hue + ',85%,58%,0.10)';
    ctx.fill();

    ctx.lineJoin = 'round';
    ctx.lineCap  = 'round';
    ctx.lineWidth   = Math.max(1.1, Math.min(w, h) * 0.008);
    ctx.strokeStyle = 'hsla(' + hue + ',90%,66%,0.95)';
    ctx.shadowColor = 'hsla(' + hue + ',95%,60%,0.85)';
    ctx.shadowBlur  = Math.max(4, Math.min(w, h) * 0.05);
    ctx.stroke();
    ctx.shadowBlur = 0;

    /* --- vertex dots (control points of the gene) --- */
    if (renderMode === 'lines') {
      const r = Math.max(0.9, Math.min(w, h) * 0.006);
      ctx.fillStyle = 'hsla(' + hue + ',95%,80%,0.85)';
      for (let i = 0; i < pts.length; i++) {
        ctx.beginPath();
        ctx.arc(toX(pts[i]), toY(pts[i]), r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawAll() {
    for (let i = 0; i < 9; i++) {
      drawGene(cells[i].canvas, genes[i], HUES[i]);
    }
  }

  function drawSnapshots() {
    for (let i = 0; i < snapshots.length; i++) {
      const s = snapshots[i];
      drawGene(s.canvas, s.gene, s.hue);
    }
  }

  function redrawAll() {
    drawAll();
    drawSnapshots();
  }

  /* ============================================================
     GRID
     ============================================================ */
  function buildGrid() {
    gridEl.innerHTML = '';
    cells = [];
    for (let i = 0; i < 9; i++) {
      const cell   = document.createElement('div');
      cell.className = 'cell';
      const canvas = document.createElement('canvas');
      cell.appendChild(canvas);
      cell.addEventListener('click', () => onCellClick(i));
      gridEl.appendChild(cell);
      cells.push({ el: cell, canvas: canvas });
    }
  }

  function flash(el) {
    el.classList.remove('flash');
    void el.offsetWidth;            // restart the animation
    el.classList.add('flash');
    window.setTimeout(() => el.classList.remove('flash'), 520);
  }

  /* ============================================================
     INTERACTION
     ============================================================ */
  function onCellClick(i) {
    const src  = Array.from(genes[i]);      // the chosen parent
    const rate = parseFloat(rateEl.value);

    // copy it into the other eight canvases, each independently mutated
    for (let j = 0; j < 9; j++) {
      if (j === i) continue;
      genes[j] = mutate(src, rate);
      flash(cells[j].el);
    }

    // the clicked canvas itself appears in the timeline
    addSnapshot(src, HUES[i]);

    drawAll();
  }

  function addSnapshot(gene, hue) {
    const snap = document.createElement('div');
    snap.className = 'snap';
    snap.title = 'load this gene into all nine canvases';

    const canvas = document.createElement('canvas');
    const label  = document.createElement('span');
    label.textContent = '#' + (++snapSeq);

    snap.appendChild(canvas);
    snap.appendChild(label);

    const frozen = Array.from(gene);

    snap.addEventListener('click', () => {
      for (let i = 0; i < 9; i++) genes[i] = Array.from(frozen);
      drawAll();
      for (let i = 0; i < 9; i++) flash(cells[i].el);
    });

    timelineEl.appendChild(snap);

    // register so a render-mode change repaints the thumbnails too
    snapshots.push({ gene: frozen, hue: hue, canvas: canvas });

    while (snapshots.length > MAX_SNAPS) {
      snapshots.shift();
      timelineEl.removeChild(timelineEl.firstChild);
    }

    requestAnimationFrame(() => {
      drawGene(canvas, frozen, hue);
      timelineEl.scrollLeft = timelineEl.scrollWidth;
    });
  }

  /* ============================================================
     RENDER-MODE TOGGLE
     ============================================================ */
  function setRenderMode(mode) {
    renderMode = mode;
    modeBtn.textContent = mode;               // shows the active mode
    modeBtn.title = 'toggle between curved and straight-line rendering';
    redrawAll();
  }

  modeBtn.addEventListener('click', () => {
    setRenderMode(renderMode === 'curves' ? 'lines' : 'curves');
  });

  /* ============================================================
     BOOT
     ============================================================ */
  function reseed() {
    genes = [];
    for (let i = 0; i < 9; i++) genes.push(randomGene());
    drawAll();
  }

  rateEl.addEventListener('input', () => {
    rateOut.textContent = Math.round(parseFloat(rateEl.value) * 100) + '%';
  });
  resetBtn.addEventListener('click', reseed);

  buildGrid();
  reseed();
  modeBtn.textContent = renderMode;
  requestAnimationFrame(drawAll);

  if (window.ResizeObserver) {
    new ResizeObserver(() => drawAll()).observe(gridEl);
  }
  window.addEventListener('resize', drawAll);

})();
</script>
</body>
</html>
